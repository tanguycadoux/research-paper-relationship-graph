name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: djlint --lint templates references/templates accounts/templates

  # The minimum supported version and the one used in development.
  test-python:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt coverage==7.16.2
      # Coverage is reported, without a minimum that would fail the build.
      - run: coverage run manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret
      - run: coverage report

  # The check required on main: green only when every Python version passed.
  tests:
    needs: test-python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-python.result }}" = "success"

  tailwind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The standalone CLI (about 110 MB) is downloaded once per Tailwind version.
      - uses: actions/cache@v4
        with:
          path: .django_tailwind_cli
          key: tailwind-cli-${{ hashFiles('config/settings.py') }}
      - run: python manage.py tailwind build
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret
