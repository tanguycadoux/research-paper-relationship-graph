name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: djlint --lint templates references/templates accounts/templates

  # The JavaScript has no build step and no dependency (#174): Node only parses each
  # file, without npm nor package.json (#341). A linter is discussed apart.
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: tools/check_js.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt coverage==7.16.2
      # Coverage is reported, without a minimum that would fail the build.
      - run: coverage run manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret
      - run: coverage report

  tailwind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      # The standalone CLI (about 110 MB) is downloaded once per Tailwind version.
      - uses: actions/cache@v4
        with:
          path: .django_tailwind_cli
          key: tailwind-cli-${{ hashFiles('config/settings.py') }}
      - run: python manage.py tailwind build
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret
