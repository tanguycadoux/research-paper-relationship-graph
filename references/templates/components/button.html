{% load ui %}
{% if url %}
    <a href="{{ url }}"
       class="{{ classes }}"
       {% if icon_only %}aria-label="{{ label }}" title="{{ label }}"{% endif %}>
        {% if icon %}{% icon icon %}{% endif %}
        {% if not icon_only %}{{ label }}{% endif %}
    </a>
{% else %}
    <button type="{{ type }}"
            class="{{ classes }}"
            {% if formaction %}formaction="{{ formaction }}"{% endif %}
            {% if name %}name="{{ name }}" value="{{ value }}"{% endif %}
            {% if icon_only %}aria-label="{{ label }}" title="{{ label }}"{% endif %}>
        {% if icon %}{% icon icon %}{% endif %}
        {% if not icon_only %}{{ label }}{% endif %}
    </button>
{% endif %}
