[project]
name = "references-manager"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "DJ",      # flake8-django
    "C90",     # mccabe complexity
    "PLR0915", # too many statements
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "references"]

[tool.djlint]
profile = "django"
# Block tags of references/templatetags/ui.py, indented like the built-in ones.
custom_blocks = "card"

[tool.coverage.run]
source = ["accounts", "config", "references"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
sort = "Cover"
